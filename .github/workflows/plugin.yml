# Builds the Supernote plugin (plugin.snplg) and attaches it to the run as a download.
name: Supernote plugin

on:
  push:
    branches: [main]
    paths:
      - "supernote/**"
      - "packages/core/src/**"
      - ".github/workflows/plugin.yml"
  workflow_dispatch:

permissions:
  contents: write   # to publish the plugin as a release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: supernote
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supernote/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci

      - name: Build plugin.snplg
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          # The template's script continues after a failed native build; surface the reason.
          if grep -q -E "APK build failed|Generated APK not found" build.log; then
            msg=$(sed 's/\x1b\[[0-9;]*m//g' build.log | grep -v '^[[:space:]]*$' | grep -v -E '^(> Task|<=|BUILD FAILED in)' \
              | grep -B70 -m1 -E "APK build failed|Generated APK not found" | tail -70 | cut -c1-300 \
              | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Native build failed::$msg"
            exit 1
          fi

      - name: Check the package
        run: |
          f=$(ls build/outputs/*.snplg | head -1)
          test -n "$f" || { echo "::error::No .snplg was produced"; exit 1; }
          echo "Package: $f"
          unzip -l "$f"
          unzip -l "$f" | grep -q "app.npk" || { echo "::error::The package has no native code (app.npk); storage would not work"; exit 1; }
          cfg=$(unzip -p "$f" PluginConfig.json)
          echo "$cfg"
          echo "::notice title=PluginConfig.json::$(echo "$cfg" | tr -d '\n' | sed 's/%/%25/g')"
          echo "$cfg" | grep -q "AsyncStoragePackage" || { echo "::error::reactPackages does not register AsyncStoragePackage"; exit 1; }
          {
            echo "## Supernote plugin built"
            echo
            echo "Download Ephemeris.snplg from the release link below (or the **Ephemeris-plugin** artifact), copy it to the MyStyle folder on the Supernote,"
            echo "then Settings > Apps > Plugins > Add Plugin."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: Ephemeris-plugin
          path: supernote/build/outputs/*.snplg
          if-no-files-found: error

      # One release that always holds the newest plugin, at a fixed link:
      # https://github.com/<owner>/<repo>/releases/download/supernote-plugin/Ephemeris.snplg
      - name: Publish the newest plugin
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls build/outputs/*.snplg | head -1)
          notes="Newest Ephemeris plugin for Supernote, built from ${GITHUB_SHA::7}. Copy Ephemeris.snplg to the MyStyle folder, then Settings > Apps > Plugins > Add Plugin."
          if gh release view supernote-plugin >/dev/null 2>&1; then
            gh release edit supernote-plugin --notes "$notes"
          else
            gh release create supernote-plugin --title "Supernote plugin" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload supernote-plugin "$f" --clobber
          {
            echo
            echo "Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/download/supernote-plugin/$(basename "$f")"
          } >> "$GITHUB_STEP_SUMMARY"
